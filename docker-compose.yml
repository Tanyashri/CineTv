services:
  # ─── Backend API ─────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cineverse-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Frontend ────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cineverse-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy
